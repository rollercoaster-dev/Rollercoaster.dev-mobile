# Validation contract: docs/architecture/ci-contract.md
name: ci-format

# Sole owner of `bun run format:check` on the PR path. ci-native-rd and
# ci-packages deliberately do NOT run it (#256) — the Prettier glob is
# workspace-wide, so one run per PR is enough. (_release-validate.yml re-runs
# it at release time as a standalone preflight.) Path filters mirror the glob.
on:
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.json"
      - "**/*.md"
      - ".prettierignore"
      - "bun.lock"
      - ".github/workflows/ci-format.yml"
  push:
    branches: [main]

concurrency:
  group: ci-format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check
