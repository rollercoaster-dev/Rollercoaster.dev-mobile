name: ci-project-manager

on:
  pull_request:
    paths:
      - "scripts/project_manager/**"
      - ".github/workflows/ci-project-manager.yml"
  push:
    branches: [main]
    paths:
      - "scripts/project_manager/**"
      - ".github/workflows/ci-project-manager.yml"

permissions:
  contents: read

concurrency:
  group: project-manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Project Manager Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7
      - name: Test guard, Telegram transport and installer without credentials
        run: bun test scripts/project_manager
