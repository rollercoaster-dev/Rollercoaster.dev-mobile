# Validation contract: docs/architecture/ci-contract.md
name: ci-native-rd

on:
  pull_request:
    paths:
      - "apps/native-rd/**"
      - "!apps/native-rd/docs/**"
      - "!apps/native-rd/research/**"
      - "!apps/native-rd/prototypes/**"
      - "packages/design-tokens/**"
      - "packages/openbadges-core/**"
      - "bun.lock"
      - "patches/**"
      - "scripts/**"
      - "bunfig.toml"
      - "turbo.json"
      - "package.json"
      - ".github/workflows/ci-native-rd.yml"
  push:
    branches: [main]

concurrency:
  group: ci-native-rd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Native-RD Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: "apps/native-rd/.nvmrc"

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-native-rd-${{ hashFiles('bun.lock', '.github/workflows/ci-native-rd.yml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-native-rd-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify patched dependencies
        run: bun run check:patches

      - name: Typecheck
        run: bun run turbo type-check --filter=native-rd

      - name: Lint
        run: bun run turbo lint --filter=native-rd

      - name: Test (with coverage)
        working-directory: apps/native-rd
        run: bun run test:ci -- --coverage

      # Coverage is published in-repo (job summary + artifact) rather than to a
      # third-party service. No token, no continue-on-error: if the summary file
      # is missing this step fails loudly instead of reporting a hollow success.
      - name: Publish coverage summary
        working-directory: apps/native-rd
        run: |
          summary=coverage/coverage-summary.json
          # Fail if the summary is missing or has no totals — an empty table
          # must not pass as "coverage published".
          jq -e '.total | length > 0' "$summary" > /dev/null
          {
            echo "### native-rd coverage"
            echo
            echo "| Metric | Covered | Total | % |"
            echo "| --- | ---: | ---: | ---: |"
            jq -r '.total | del(.branchesTrue) | to_entries[] | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct) |"' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-native-rd
          path: apps/native-rd/coverage/
          if-no-files-found: error

      - name: a11y audit
        if: always()
        working-directory: apps/native-rd
        run: bun run test:a11y:json > a11y.json

      - name: Upload a11y artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-audit
          path: apps/native-rd/a11y.json
          if-no-files-found: error

      - name: Storybook web build
        working-directory: apps/native-rd
        run: bun run storybook:web:build
