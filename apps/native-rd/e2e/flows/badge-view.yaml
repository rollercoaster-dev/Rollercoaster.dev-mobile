appId: dev.rollercoaster.app
tags:
  - required
env:
  METRO_HOST: localhost
  METRO_PORT: "8081"
  # Dev-client URL scheme. scripts/run-e2e.sh --android rewrites this default in
  # its e2e/.android copy (the local `.dev` build registers `rollercoasterdev-dev`,
  # app.config.js); a `-e` override does not beat a flow-level default.
  DEV_CLIENT_SCHEME: exp+rollercoasterdev
---
# Badges tab navigation smoke test.
#
# Isolation comes from the shared prologue (clearState + clearKeychain), so the
# empty-state assertion holds regardless of suite order — Maestro runs flows
# alphabetically, and without the reset an earlier flow's earned badge breaks it.
- runFlow:
    file: ../subflows/launch-and-onboard.yaml
    env:
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}
      DEV_CLIENT_SCHEME: ${DEV_CLIENT_SCHEME}
      THEME_SWATCH: light-autismFriendly

# Tap the Badges tab and confirm the empty state.
#
# Asserted by testID, not copy: the old text matcher pointed at
# `badges:empty.title`, a key with NO consumer — BadgesWall renders
# `badges:wall.empty.title` ("Your first badge is waiting"). The assertion had
# been passing on nothing.
- tapOn:
    id: "tab-BadgesTab"
- assertVisible:
    id: "badges-wall-see-goals"
