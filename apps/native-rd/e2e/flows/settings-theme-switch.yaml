appId: dev.rollercoaster.app
tags:
  - required
env:
  METRO_HOST: localhost
  METRO_PORT: "8081"
  # Dev-client URL scheme. scripts/run-e2e.sh --android rewrites this default in
  # its e2e/.android copy (the local `.dev` build registers `rollercoasterdev-dev`,
  # app.config.js); a `-e` override does not beat a flow-level default.
  DEV_CLIENT_SCHEME: exp+rollercoasterdev
---
# Theme switcher — verify "Night Ride" selection takes effect.
#
# Companion: settings-theme-persists-restart.yaml extends this with a relaunch.
#
# This flow used to open with a bare `launchApp` and no onboarding prefix, so
# its outcome assertion only passed on state left behind by the alphabetically
# preceding flow — which happened to set and persist Night Ride already. It now
# takes the shared prologue like every other flow, starting from `light-default`
# ("The Full Ride") so switching to Night Ride is a real change.
- runFlow:
    file: ../subflows/launch-and-onboard.yaml
    env:
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}
      DEV_CLIENT_SCHEME: ${DEV_CLIENT_SCHEME}
      THEME_SWATCH: light-default

# Settings tab is a gear icon — no text node to match, must use testID.
- tapOn:
    id: "tab-SettingsTab"
- assertVisible: "Settings"
# Section heading of SettingsThemeSection (`settings:theme.title`). Since #416
# the Settings theme picker is the ThemeSwatchRail, not the old ThemeSwitcher.
- assertVisible: "Theme"
- tapOn:
    id: "theme-swatch-dark-default"
# The rail's caption carries the `selected-theme` testID and always renders the
# SELECTED theme's label, so the combined matcher is a real outcome assertion:
# it fails if the tap didn't take effect, where a bare id match would not.
- assertVisible:
    id: "selected-theme"
    text: "Night Ride"
