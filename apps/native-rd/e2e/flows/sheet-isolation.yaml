appId: dev.rollercoaster.app
env:
  METRO_HOST: localhost
  METRO_PORT: "8081"
  # scripts/run-e2e.sh --android rewrites this default in its e2e/.android copy.
  DEV_CLIENT_SCHEME: exp+rollercoasterdev
---
# ============================================================================
# SHEET ISOLATION (#686)
#
# While an in-tree AnimatedSheet is open, everything behind it — the screen
# body, its header, and the navigator's tab bar — must be out of the
# accessibility tree, and back once the sheet closes. Maestro reads that tree
# (XCUITest on iOS, UiAutomator on Android), so `assertNotVisible` on a control
# that is still painted on screen is the assistive-tech check: the tab bar never
# leaves the screen visually, only the tree.
#
# Covers Focus Mode's evidence-plan and capture sheets, Badge detail's share
# sheet from both openers, and a tab switch with the share sheet left open
# (the other tab's chrome must stay reachable). Focus *restoration* is not
# observable here; it is covered in Jest and needs a VoiceOver/TalkBack pass.
# ============================================================================

- runFlow:
    file: ../subflows/launch-and-onboard.yaml
    env:
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}
      DEV_CLIENT_SCHEME: ${DEV_CLIENT_SCHEME}
      THEME_SWATCH: light-autismFriendly

# --- A one-step goal (default plan: one text note) --------------------------
- tapOn:
    id: "goals-cockpit-new-goal"
- tapOn:
    id: "new-goal-title-input"
- inputText: "Sheet isolation goal"
- pressKey: Enter
- tapOn:
    id: "new-goal-next-button"
- tapOn:
    id: "new-goal-first-step-input"
- inputText: "Isolated step"
- pressKey: Enter
- tapOn:
    id: "new-goal-next-button"
- tapOn:
    id: "new-goal-build-ready-button"
- tapOn:
    id: "new-goal-start-working-button"
- extendedWaitUntil:
    visible:
      id: "focus-current-task-add-text"
    timeout: 15000
- assertVisible:
    id: "tab-GoalsTab"
- assertVisible: "Go back"

# --- 1. Focus › evidence-plan sheet ------------------------------------------
- tapOn:
    id: "focus-current-task-change-plan"
- assertVisible:
    id: "focus-evidence-plan-close"
- assertNotVisible:
    id: "tab-GoalsTab"
- assertNotVisible:
    id: "focus-current-task-add-text"
- assertNotVisible: "Go back"
- tapOn:
    id: "focus-evidence-plan-close"
- assertVisible:
    id: "tab-GoalsTab"
- assertVisible:
    id: "focus-current-task-add-text"
- assertVisible: "Go back"

# --- 2. Focus › capture sheet ("Add more evidence") --------------------------
- tapOn:
    id: "focus-current-task-add-text"
- tapOn:
    id: "capture-text-body"
- inputText: "Captured so the step can finish."
- tapOn:
    id: "capture-text-save"
- extendedWaitUntil:
    visible:
      id: "focus-current-task-add-more"
    timeout: 15000
- tapOn:
    id: "focus-current-task-add-more"
- assertVisible:
    id: "capture-sheet-close"
- assertNotVisible:
    id: "tab-GoalsTab"
- assertNotVisible:
    id: "focus-current-task-mark-complete"
- assertNotVisible: "Go back"
- tapOn:
    id: "capture-sheet-close"
- assertVisible:
    id: "tab-GoalsTab"
- assertVisible:
    id: "focus-current-task-mark-complete"

# --- Earn the badge (same path as evidence-gate.yaml's recovery lap) --------
- tapOn:
    id: "focus-progress-strip"
- scrollUntilVisible:
    element:
      id: "finish-line-cta"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "finish-line-cta"
- extendedWaitUntil:
    visible:
      id: "finish-celebrate-stage"
    timeout: 15000
- tapOn:
    id: "finish-celebrate-cta"
- tapOn:
    id: "finish-design-bake"
- extendedWaitUntil:
    visible:
      id: "finish-reveal-stage"
    timeout: 20000
- tapOn:
    id: "finish-reveal-view-badge"
- extendedWaitUntil:
    visible:
      id: "celebration-hero-overflow"
    timeout: 15000

# --- 3. Badge detail › share sheet from the Share CTA ------------------------
- tapOn:
    id: "badge-share-cta"
- assertVisible:
    id: "share-row-verifiable"
- assertNotVisible:
    id: "celebration-hero-overflow"
- assertNotVisible:
    id: "badge-share-cta"
- assertNotVisible:
    id: "tab-BadgesTab"
- tapOn:
    id: "badge-share-close"
- assertVisible:
    id: "celebration-hero-overflow"
- assertVisible:
    id: "badge-share-cta"
- assertVisible:
    id: "tab-BadgesTab"

# --- 4. Same sheet from ⋯ › Share badge -------------------------------------
- tapOn:
    id: "celebration-hero-overflow"
- tapOn:
    id: "overflow-row-share"
- assertVisible:
    id: "share-row-verifiable"
- assertNotVisible:
    id: "celebration-hero-overflow"
- assertNotVisible:
    id: "tab-BadgesTab"

# --- 5. Leave the sheet open and switch tabs by touch -----------------------
# The tab bar is out of the tree, so it is tapped by position: Goals is the
# first of three equal slots in the bottom pill. The sheet stays open in the
# now-unfocused Badges stack; the Goals tab's own chrome must be reachable.
- tapOn:
    point: "17%, 94%"
- extendedWaitUntil:
    visible:
      id: "goals-cockpit-new-goal"
    timeout: 15000
- assertVisible:
    id: "tab-BadgesTab"
- assertVisible:
    id: "tab-GoalsTab"
