appId: dev.rollercoaster.app
tags:
  - required
env:
  METRO_HOST: localhost
  METRO_PORT: "8081"
  # Dev-client URL scheme. scripts/run-e2e.sh --android rewrites this default in
  # its e2e/.android copy (the local `.dev` build registers `rollercoasterdev-dev`,
  # app.config.js); a `-e` override does not beat a flow-level default.
  DEV_CLIENT_SCHEME: exp+rollercoasterdev
---
# Theme persistence — verify Night Ride survives a full app restart.
#
# Companion: settings-theme-switch.yaml asserts immediate selection; this flow
# extends it with a relaunch to verify Evolu-backed persistence.
#
# The prologue starts from `light-default` ("The Full Ride") so the switch below
# is a real change rather than a re-selection.
- runFlow:
    file: ../subflows/launch-and-onboard.yaml
    env:
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}
      DEV_CLIENT_SCHEME: ${DEV_CLIENT_SCHEME}
      THEME_SWATCH: light-default

# Switch to Night Ride and verify immediate selection.
- tapOn:
    id: "tab-SettingsTab"
# Section heading of SettingsThemeSection (`settings:theme.title`) — since #416
# the Settings picker is the ThemeSwatchRail, not the old ThemeSwitcher.
- assertVisible: "Theme"
- tapOn:
    id: "theme-swatch-dark-default"
- assertVisible:
    id: "selected-theme"
    text: "Night Ride"

# Restart with state PRESERVED — this relaunch is deliberately inline rather
# than a second runFlow of the prologue, which would clearState and destroy the
# very thing under test.
- stopApp
- openLink: "${DEV_CLIENT_SCHEME}://expo-development-client/?url=http%3A%2F%2F${METRO_HOST}%3A${METRO_PORT}"
# Positive barrier, same reasoning as the prologue's: a negative assertion
# passes instantly on the empty tree that exists before the bundle mounts.
# Post-restart we land on the cockpit, not Welcome.
- extendedWaitUntil:
    visible:
      id: "goals-cockpit-new-goal"
    timeout: 60000

# The barrier above doubles as the "onboarding did not replay" assertion:
# hasSeenWelcome=1 was persisted before the restart, so we land straight on the
# cockpit. Asserted on the cockpit's own testID, never `assertVisible: "Goals"`
# — GoalsScreen renders "Today" whenever a hero goal is pinned (#502 D7).

- tapOn:
    id: "tab-SettingsTab"
- assertVisible: "Theme"

# Deterministic post-restart assertion: the node bearing the `selected-theme`
# testID is the rail's caption label, which always renders the SELECTED theme's
# name (see ThemeSwatchRail.tsx). If persistence regressed and the app defaulted
# back to light-default, that caption would read "The Full Ride" and this
# combined matcher would fail.
- assertVisible:
    id: "selected-theme"
    text: "Night Ride"
