appId: dev.rollercoaster.app
tags:
  - optional
env:
  METRO_HOST: localhost
  METRO_PORT: "8081"
---
# Evidence viewer flow — capture mixed-type evidence (one link + one text),
# open the Timeline, tap a card to push EvidenceViewerScreen, switch via the
# thumbnail strip, then back out to Timeline.
#
# Mixing two types (vs. two text notes): exercises distinct render branches in
# EvidenceContent (LinkContent vs TextContent) — a real "viewer" smoke test,
# not just pagination. Captions on both items give the Timeline cards unique
# labels Maestro can match without ambiguity.
#
# Captures are ordered link → text so the createdAt-desc viewer ordering puts
# text at index 0 ("1 / 2") and link at index 1 ("2 / 2") — the counter ascends
# in the same direction the flow walks the strip.
#
# THE ONE FLOW THAT STILL REQUIRES `EXPO_PUBLIC_E2E_MODE=true`: the thumbnail
# strip and its cells drop their a11y grouping only under that gate
# (EvidenceThumbnail / ViewerStripThumb). Launch via `bun run ios:e2e` —
# EXPO_PUBLIC_* is inlined by Metro at serve time, so the ordinary `ios` build
# does not carry it.
#
# The creation head and the capture entry were both rewritten for #502: the old
# head drove the retired FAB → create → badge-designer path, and the old capture
# entry went through EvidenceDrawer + FABMenu, which #455 deleted outright
# (component AND locale keys). Neither set of selectors resolves any more.
- runFlow:
    file: ../subflows/launch-and-onboard.yaml
    env:
      METRO_HOST: ${METRO_HOST}
      METRO_PORT: ${METRO_PORT}
      THEME_SWATCH: light-autismFriendly

# --- Create a goal with one step planning [text, link] ----------------------
- tapOn:
    id: "goals-cockpit-new-goal"
- assertVisible:
    id: "new-goal-wizard-content"
- tapOn:
    id: "new-goal-title-input"
- inputText: "Curate evidence demo"
- tapOn:
    id: "new-goal-next-button"
- tapOn:
    id: "new-goal-first-step-input"
- inputText: "Capture mixed evidence"
# Capture grid is single-select and self-closes on pick.
- tapOn:
    id: "new-goal-evidence-chip"
- assertVisible:
    id: "animated-sheet-overlay"
- tapOn:
    id: "evidence-type-cell-text"
- tapOn:
    id: "new-goal-next-button"
# Build step: widen to [text, link]. The multi-select handler never closes the
# sheet, so the close tap is required here (unlike the grid above).
- tapOn:
    id: "edit-goal-step-evidence-step-1"
- assertVisible:
    id: "animated-sheet-overlay"
- tapOn:
    id: "evidence-type-chip-link"
- tapOn:
    id: "new-goal-evidence-close"
- tapOn:
    id: "new-goal-build-ready-button"
- assertVisible:
    id: "new-goal-start-working-button"
- tapOn:
    id: "new-goal-start-working-button"

# --- Capture the link first (older) -----------------------------------------
# Per-type invites replace the old FAB → FABMenu path. `pressKey: Enter` after
# the caption fires the keyboard's blue check (returnKeyType="done") to dismiss
# the soft keyboard so Save is tappable — CaptureLinkScreen has no
# KeyboardAvoidingView, so without dismissing first the Save tap lands on the
# keyboard. Enter on the URL field does not help: it is returnKeyType="next".
- extendedWaitUntil:
    visible:
      id: "focus-current-task-add-link"
    timeout: 15000
- tapOn:
    id: "focus-current-task-add-link"
- assertVisible: "Add Link"
- tapOn:
    id: "capture-link-url"
- inputText: "https://archive.org/details/community-history"
- tapOn:
    id: "capture-link-caption"
- inputText: "Reference archive"
- pressKey: Enter
- tapOn:
    id: "capture-link-save"

# --- Capture the text note (newer) ------------------------------------------
- extendedWaitUntil:
    visible:
      id: "focus-current-task-add-text"
    timeout: 15000
- tapOn:
    id: "focus-current-task-add-text"
- assertVisible: "Write a Note"
- tapOn:
    id: "capture-text-body"
- inputText: "Reflection on archive sources"
- tapOn:
    id: "capture-text-caption"
- inputText: "Text reflection"
- pressKey: Enter
- tapOn:
    id: "capture-text-save"

# --- Timeline ---------------------------------------------------------------
- extendedWaitUntil:
    visible:
      id: "focus-current-task-mark-complete"
    timeout: 15000
- tapOn:
    id: "focus-progress-strip"
- assertVisible: "Timeline"

# Expand the step row so its evidence cards are visible. Without the assert the
# next tap could appear-pass on a stale "Text reflection" caption if the expand
# silently no-ops.
- tapOn:
    text: "Capture mixed evidence.*"
- assertVisible: "Text reflection"

# Tap the text-evidence card → EvidenceViewerScreen pushes in.
# Text was captured second so it's index 0 in the createdAt-desc sort.
- tapOn:
    text: "Text reflection"
- assertVisible: "Evidence"
- assertVisible: "1 / 2"

# Switch to the link-evidence thumbnail (link was captured first → index 1).
- tapOn:
    text: "Reference archive"
- assertVisible: "2 / 2"

# Back to Timeline
- tapOn: "Go back"
- assertVisible: "Timeline"
- assertVisible: "Text reflection"
