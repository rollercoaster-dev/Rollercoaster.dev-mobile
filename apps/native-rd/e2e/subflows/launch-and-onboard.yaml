appId: dev.rollercoaster.app
env:
  METRO_HOST: localhost
  METRO_PORT: "8081"
  # Dev-client URL scheme. scripts/run-e2e.sh --android rewrites this default in
  # its e2e/.android copy (the local `.dev` build registers `rollercoasterdev-dev`,
  # app.config.js); a `-e` override does not beat a flow-level default.
  DEV_CLIENT_SCHEME: exp+rollercoasterdev
  # Autism-Friendly (`Still Water`). One tap buys every determinism lever at
  # once: useAnimationPref.ts forces animationPref = "none" for this variant,
  # which renders the discrete ↑/↓/nest hierarchy controls (EditGoalStepList),
  # suppresses finish-reveal-sparkles, zeroes AnimatedSheet exit timing, and
  # makes the tab knob snap instead of animate. Override per flow if a run
  # needs a different theme — nothing here is locked in (#502 D3/D25).
  THEME_SWATCH: light-autismFriendly
---
# Shared prologue: isolation → dev-client boot → onboarding → determinism lever.
#
# Lives in `e2e/subflows/`, NOT `e2e/flows/`, because scripts/run-e2e.sh runs
# every yaml under `e2e/flows/` as a top-level flow. A prologue in `flows/`
# would execute standalone on every suite run (#502 D2).
#
# Isolation idiom, used by every flow with no exceptions (#502 D1):
#   - clearState    → one atomic reset of onboarding, theme, density and
#                     pinnedGoalId, which all live in the same Evolu SQLite file
#   - clearKeychain → Ed25519 signing keys live in Keychain and are NOT touched
#                     by clearState, so a repeatable bake needs this too
- launchApp:
    clearState: true
    clearKeychain: true
# `launchApp` leaves the app RUNNING, and a running dev client has already
# picked a packager — on a machine with any other Metro on the default 8081 it
# picks that one, and the deep link below is then ignored (verified: 60s of
# waiting with zero requests reaching the intended port). Stopping the app first
# makes the `openLink` a cold start whose ONLY input is the URL, which is what
# actually pins the bundle to ${METRO_HOST}:${METRO_PORT}.
- stopApp
# Expo SDK 55 dev-client lands on its server picker after clearState instead of
# auto-reloading the last bundle. Bypass via the dev-client deep-link
# `<scheme>://expo-development-client/?url=<bundle-url>`. Onboarding hint +
# dev-menu modals are pre-disabled in run-e2e.sh on iOS; see the Android block
# below for why they cannot be on Android.
#
# Host AND port are parameterized: scripts/worktree-boot.sh puts a worktree's
# Metro on a path-hashed port in 8080–8179, so a hardcoded 8081 cannot run
# against one (#502 D22). The scheme is parameterized too: on a phone that also
# carries the store build, `exp+rollercoasterdev://` raises an Android app
# chooser (both builds register it) and the suite hangs on the launcher, so the
# local `.dev` build registers its own `rollercoasterdev-dev` (app.config.js).
- openLink: "${DEV_CLIENT_SCHEME}://expo-development-client/?url=http%3A%2F%2F${METRO_HOST}%3A${METRO_PORT}"
# Android only: the expo-dev-menu onboarding sheet ("Continue") covers the app
# on the first bundle load after every `clearState`. On iOS run-e2e.sh seeds
# `EXDevMenuIsOnboardingFinished` once and Maestro's clearState leaves
# UserDefaults alone (Maestro #1601), so the sheet never shows. On Android the
# equivalent lives in the app's shared_prefs, which `pm clear` wipes on every
# flow — and re-seeding it from the host races the app's own write. So the
# sheet is treated as a deterministic fixture instead: it ALWAYS appears here,
# and the flow dismisses it. Tapping Continue drops into the dev menu itself on
# some launches, hence the optional Close.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 60000
      - tapOn: "Continue"
      - tapOn:
          text: "Close"
          optional: true
# Boot barrier. This MUST be a positive wait, not `notVisible: app-loading`:
# between the `clearState` reinstall and the dev client finishing its bundle
# fetch there is no React root at all, so a negative assertion passes instantly
# on an empty tree and every following step races the bundle download.
# `welcome-get-started` is the first thing that exists only once the bundle has
# mounted AND Evolu has resolved `isFirstLaunch` to true, so it clears both.
- extendedWaitUntil:
    visible:
      id: "welcome-get-started"
    timeout: 60000
# Belt and braces: `app-loading` is the bare background View App.tsx renders
# while `isFirstLaunch === null`. It cannot still be up once the CTA above is
# visible, but asserting it keeps the id meaningful and documents the state.
- assertNotVisible:
    id: "app-loading"
- tapOn:
    id: "theme-swatch-${THEME_SWATCH}"
- tapOn:
    id: "welcome-get-started"
# Arrival is asserted on a surface testID, never `assertVisible: "Goals"`:
# GoalsScreen renders "Today" whenever a hero goal is pinned and "Goals" only
# when empty, so the text assertion is silently conditional (#502 D7).
- assertVisible:
    id: "goals-cockpit-new-goal"
